<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanSocial Global - Muro, Chat & Perfiles</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .app-container { width: 100%; max-width: 610px; height: 92vh; background-color: #1e1e24; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }

        /* Cabecera y perfil rápido */
        .header { background-color: #2b2b36; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a3a48; gap: 8px; flex-wrap: wrap; }
        .header h1 { font-size: 1.15rem; color: #00d4ff; }
        .header-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .profile-box { display: flex; align-items: center; gap: 6px; background-color: #22222c; padding: 4px 8px; border-radius: 12px; border: 1px solid #383848; }
        .avatar-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #00d4ff; background-color: #323242; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; font-size: 0.95rem; padding: 0; flex-shrink: 0; }
        .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

        select, .nick-input, .custom-lang-input, .dm-input { background-color: #1e1e24; color: white; border: 1px solid #00d4ff; padding: 5px 8px; border-radius: 8px; font-size: 0.82rem; }
        .nick-input { width: 98px; }
        .custom-lang-input { width: 76px; display: none; }

        /* Notificación toast de mensaje privado */
        .toast-banner { display: none; align-items: center; justify-content: space-between; gap: 10px; background: linear-gradient(90deg, #004d66, #1d3557); border-bottom: 1px solid #00d4ff; padding: 9px 14px; font-size: 0.84rem; animation: fadeInToast 0.2s ease; }
        .toast-banner.show { display: flex; }
        @keyframes fadeInToast { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .toast-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
        .toast-text-wrap { display: flex; flex-direction: column; min-width: 0; }
        .toast-title { font-weight: bold; color: #7ae7ff; font-size: 0.8rem; }
        .toast-preview { color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.82rem; }
        .toast-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .toast-open-btn { background-color: #00d4ff; color: #121212; border: none; padding: 5px 10px; border-radius: 7px; font-weight: bold; font-size: 0.76rem; cursor: pointer; }
        .toast-close-btn { background-color: rgba(255,255,255,0.12); color: #fff; border: none; padding: 5px 8px; border-radius: 7px; font-size: 0.76rem; cursor: pointer; }

        /* Avatares y enlaces de usuario */
        .mini-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid #4a4a62; background-color: #323242; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; flex-shrink: 0; }
        .chat-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 1px solid #52526d; background-color: #323242; display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0; }
        .author-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .user-link { cursor: pointer; text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 5px; }
        .user-link:hover .post-author, .user-link:hover { text-decoration: underline; color: #5ce1ff; }

        /* Navegación principal: 3 pestañas */
        .main-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; background-color: #23232d; border-bottom: 1px solid #3a3a48; }
        .tab-btn { padding: 10px 6px; background: none; border: none; color: #aaa; font-weight: bold; cursor: pointer; font-size: 0.88rem; border-bottom: 3px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .tab-btn.active { color: #00d4ff; border-bottom-color: #00d4ff; background-color: #1e1e24; }
        .badge-pill { background-color: #ff3b5c; color: #fff; font-size: 0.7rem; font-weight: bold; padding: 1px 6px; border-radius: 999px; display: none; }
        .badge-pill.visible { display: inline-block; }

        /* Vistas */
        .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .view.active { display: flex; }

        /* Muro estilo X */
        .composer { padding: 12px; background-color: #252530; border-bottom: 1px solid #3a3a48; display: flex; flex-direction: column; gap: 8px; }
        .composer textarea { width: 100%; min-height: 58px; resize: vertical; padding: 10px; border-radius: 10px; border: 1px solid #3a3a48; background-color: #1e1e24; color: white; outline: none; font-size: 0.92rem; }
        .composer-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .img-url-input { flex: 1; min-width: 150px; padding: 7px 10px; border-radius: 8px; border: 1px solid #3a3a48; background-color: #1e1e24; color: #ddd; font-size: 0.8rem; outline: none; }
        .file-btn { background-color: #323240; color: #00d4ff; border: 1px solid #00d4ff; padding: 7px 11px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; white-space: nowrap; }
        .clear-img-btn { background-color: #46262d; color: #ff9aa9; border: 1px solid #ff3b5c; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.76rem; }
        .preview-strip { display: none; align-items: center; gap: 10px; background-color: #1e1e24; padding: 6px 10px; border-radius: 8px; border: 1px dashed #3a3a48; }
        .preview-strip.active { display: flex; }
        .preview-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
        .preview-label { font-size: 0.78rem; color: #9ce6c2; flex: 1; }

        .post-btn { background-color: #00d4ff; color: #121212; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .post-btn:disabled { background-color: #555; cursor: not-allowed; }

        .feed-box { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .post-card { background-color: #282834; border: 1px solid #363645; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .repost-tag { font-size: 0.75rem; color: #8be9b5; font-weight: 600; }
        .post-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #b5b5c7; gap: 6px; flex-wrap: wrap; }
        .post-author { font-weight: bold; color: #00d4ff; }
        .edited-tag { font-size: 0.72rem; color: #9ea0b8; font-style: italic; }
        .owner-tools { display: flex; gap: 6px; align-items: center; }
        .mini-btn { background: #323242; color: #d6d7e6; border: 1px solid #444459; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 0.72rem; font-weight: 600; }
        .mini-btn:hover { background: #3f3f54; }
        .mini-btn.delete { color: #ff8a9d; border-color: #7a3240; background: #382026; }
        .mini-btn.delete:hover { background: #4d2630; }

        .edit-box { display: flex; flex-direction: column; gap: 6px; background-color: #1d1d26; padding: 8px; border-radius: 10px; border: 1px solid #00d4ff; }
        .edit-textarea { width: 100%; min-height: 56px; resize: vertical; padding: 8px; border-radius: 8px; border: 1px solid #3a3a48; background-color: #14141b; color: #fff; font-size: 0.9rem; outline: none; }
        .edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
        .save-edit-btn { background-color: #00d4ff; color: #121212; border: none; padding: 5px 12px; border-radius: 7px; font-weight: bold; font-size: 0.78rem; cursor: pointer; }
        .cancel-edit-btn { background-color: #343444; color: #ddd; border: none; padding: 5px 10px; border-radius: 7px; font-size: 0.78rem; cursor: pointer; }

        .post-body { font-size: 0.95rem; line-height: 1.45; white-space: pre-wrap; }
        .post-img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 10px; border: 1px solid #3e3e50; }
        .original-text { font-size: 0.78rem; color: #9ce6c2; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.18); font-style: italic; }

        /* Acciones del muro: Responder, Compartir, Me gusta */
        .post-actions { display: flex; justify-content: space-around; border-top: 1px solid #363645; padding-top: 8px; gap: 6px; }
        .action-btn { flex: 1; background: #23232d; color: #cfd0e0; border: 1px solid #343444; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .action-btn:hover { background: #30303e; }
        .action-btn.liked { color: #ff6b84; border-color: #ff6b84; background: rgba(255, 59, 92, 0.12); }

        /* Caja de respuestas */
        .replies-box { display: none; flex-direction: column; gap: 8px; background-color: #20202a; padding: 10px; border-radius: 10px; border: 1px solid #323242; margin-top: 2px; }
        .replies-box.open { display: flex; }
        .reply-item { background-color: #2a2a38; padding: 7px 10px; border-radius: 8px; font-size: 0.84rem; display: flex; flex-direction: column; gap: 3px; }
        .reply-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .reply-meta { font-size: 0.72rem; color: #9fd8ef; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        .reply-form { display: flex; gap: 6px; }
        .reply-input { flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid #3a3a48; background-color: #181820; color: #fff; font-size: 0.82rem; outline: none; }
        .reply-send-btn { background-color: #00d4ff; color: #121212; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.78rem; cursor: pointer; }

        /* Vista de Perfil */
        .profile-search-bar { display: flex; gap: 6px; padding: 10px 14px; background-color: #252530; border-bottom: 1px solid #3a3a48; align-items: center; flex-wrap: wrap; }
        .profile-card { background: linear-gradient(145deg, #282836, #21212c); border: 1px solid #3b3b4e; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .profile-top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
        .profile-big-avatar { width: 74px; height: 74px; border-radius: 50%; border: 3px solid #00d4ff; background-color: #323242; display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow: hidden; flex-shrink: 0; }
        .profile-big-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 4px; }
        .profile-handle { font-size: 1.15rem; font-weight: bold; color: #00d4ff; }
        .profile-bio { font-size: 0.88rem; color: #d5d7e6; line-height: 1.4; }
        .profile-stats { display: flex; gap: 14px; font-size: 0.8rem; color: #9ce6c2; margin-top: 2px; }
        .profile-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .bio-edit-row { display: flex; gap: 6px; width: 100%; margin-top: 4px; }
        .bio-input { flex: 1; padding: 7px 10px; border-radius: 8px; border: 1px solid #3a3a48; background-color: #181820; color: #fff; font-size: 0.82rem; outline: none; }
        .section-divider { font-size: 0.84rem; font-weight: bold; color: #a9acc4; padding: 4px 2px; border-bottom: 1px solid #343444; }

        /* Chat en vivo */
        .rooms { display: flex; background-color: #252530; padding: 8px; gap: 8px; overflow-x: auto; align-items: center; }
        .room-btn { background: #323240; color: #ccc; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
        .room-btn.active { background: #00d4ff; color: #121212; font-weight: bold; }

        .dm-bar { display: none; background-color: #22222c; padding: 8px 12px; gap: 8px; align-items: center; border-bottom: 1px solid #3a3a48; flex-wrap: wrap; }
        .dm-bar.active { display: flex; }
        .dm-input { flex: 1; min-width: 140px; }
        .dm-connect-btn { background-color: #00d4ff; color: #121212; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.82rem; cursor: pointer; }
        .dm-status { font-size: 0.78rem; color: #9ce6c2; width: 100%; }
        .dm-shortcuts { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
        .dm-chip { background: #2e2e3d; color: #e2e8f0; border: 1px solid #46465c; padding: 3px 9px; border-radius: 999px; font-size: 0.75rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        .dm-chip.unread { border-color: #ff3b5c; color: #ffb3c1; font-weight: bold; }

        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; }
        .message.received { background-color: #2d2d3a; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.sent { background-color: #005c7a; align-self: flex-end; border-bottom-right-radius: 2px; }
        .meta { font-size: 0.75rem; color: #b5b5c7; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
        .input-area { display: flex; padding: 12px; background-color: #2b2b36; gap: 8px; }
        input.msg-input { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; background-color: #1e1e24; color: white; outline: none; }
        button.send-btn { background-color: #00d4ff; color: #121212; border: none; padding: 0 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        button.send-btn:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>🌐 PanSocial Global</h1>
        <div class="header-controls">
            <div class="profile-box" title="Ver mi perfil o editar mi @usuario">
                <button type="button" class="avatar-btn
