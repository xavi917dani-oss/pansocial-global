<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eggs - Muro, Chat & Perfiles</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .app-container { width: 100%; max-width: 610px; height: 92vh; background-color: #1e1e24; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }

        /* Cabecera y perfil rápido */
        .header { background-color: #2b2b36; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a3a48; gap: 8px; flex-wrap: wrap; }
        .header h1 { font-size: 1.15rem; color: #00d4ff; }
        .header-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .profile-box { display: flex; align-items: center; gap: 6px; background-color: #22222c; padding: 4px 8px; border-radius: 12px; border: 1px solid #383848; }
        .avatar-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #00d4ff; background-color: #323242; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; font-size: 0.95rem; padding: 0; flex-shrink: 0; }
        .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

        select, .nick-input, .custom-lang-input, .dm-input { background-color: #1e1e24; color: white; border: 1px solid #00d4ff; padding: 5px 8px; border-radius: 8px; font-size: 0.82rem; }
        .nick-input { width: 98px; }
        .custom-lang-input { width: 76px; display: none; }

        /* Notificación toast de mensaje privado */
        .toast-banner { display: none; align-items: center; justify-content: space-between; gap: 10px; background: linear-gradient(90deg, #004d66, #1d3557); border-bottom: 1px solid #00d4ff; padding: 9px 14px; font-size: 0.84rem; animation: fadeInToast 0.2s ease; }
        .toast-banner.show { display: flex; }
        @keyframes fadeInToast { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .toast-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
        .toast-text-wrap { display: flex; flex-direction: column; min-width: 0; }
        .toast-title { font-weight: bold; color: #7ae7ff; font-size: 0.8rem; }
        .toast-preview { color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.82rem; }
        .toast-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .toast-open-btn { background-color: #00d4ff; color: #121212; border: none; padding: 5px 10px; border-radius: 7px; font-weight: bold; font-size: 0.76rem; cursor: pointer; }
        .toast-close-btn { background-color: rgba(255,255,255,0.12); color: #fff; border: none; padding: 5px 8px; border-radius: 7px; font-size: 0.76rem; cursor: pointer; }

        /* Avatares y enlaces de usuario */
        .mini-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid #4a4a62; background-color: #323242; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; flex-shrink: 0; }
        .chat-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 1px solid #52526d; background-color: #323242; display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0; }
        .author-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .user-link { cursor: pointer; text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 5px; }
        .user-link:hover .post-author, .user-link:hover { text-decoration: underline; color: #5ce1ff; }

        /* Navegación principal: 3 pestañas */
        .main-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; background-color: #23232d; border-bottom: 1px solid #3a3a48; }
        .tab-btn { padding: 10px 6px; background: none; border: none; color: #aaa; font-weight: bold; cursor: pointer; font-size: 0.88rem; border-bottom: 3px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .tab-btn.active { color: #00d4ff; border-bottom-color: #00d4ff; background-color: #1e1e24; }
        .badge-pill { background-color: #ff3b5c; color: #fff; font-size: 0.7rem; font-weight: bold; padding: 1px 6px; border-radius: 999px; display: none; }
        .badge-pill.visible { display: inline-block; }

        /* Vistas */
        .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .view.active { display: flex; }

        /* Muro estilo X */
        .composer { padding: 12px; background-color: #252530; border-bottom: 1px solid #3a3a48; display: flex; flex-direction: column; gap: 8px; }
        .composer textarea { width: 100%; min-height: 58px; resize: vertical; padding: 10px; border-radius: 10px; border: 1px solid #3a3a48; background-color: #1e1e24; color: white; outline: none; font-size: 0.92rem; }
        .composer-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .img-url-input { flex: 1; min-width: 150px; padding: 7px 10px; border-radius: 8px; border: 1px solid #3a3a48; background-color: #1e1e24; color: #ddd; font-size: 0.8rem; outline: none; }
        .file-btn { background-color: #323240; color: #00d4ff; border: 1px solid #00d4ff; padding: 7px 11px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; white-space: nowrap; }
        .clear-img-btn { background-color: #46262d; color: #ff9aa9; border: 1px solid #ff3b5c; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.76rem; }
        .preview-strip { display: none; align-items: center; gap: 10px; background-color: #1e1e24; padding: 6px 10px; border-radius: 8px; border: 1px dashed #3a3a48; }
        .preview-strip.active { display: flex; }
        .preview-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
        .preview-label { font-size: 0.78rem; color: #9ce6c2; flex: 1; }

        .post-btn { background-color: #00d4ff; color: #121212; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .post-btn:disabled { background-color: #555; cursor: not-allowed; }

        .feed-box { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .post-card { background-color: #282834; border: 1px solid #363645; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .repost-tag { font-size: 0.75rem; color: #8be9b5; font-weight: 600; }
        .post-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #b5b5c7; gap: 6px; flex-wrap: wrap; }
        .post-author { font-weight: bold; color: #00d4ff; }
        .edited-tag { font-size: 0.72rem; color: #9ea0b8; font-style: italic; }
        .owner-tools { display: flex; gap: 6px; align-items: center; }
        .mini-btn { background: #323242; color: #d6d7e6; border: 1px solid #444459; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 0.72rem; font-weight: 600; }
        .mini-btn:hover { background: #3f3f54; }
        .mini-btn.delete { color: #ff8a9d; border-color: #7a3240; background: #382026; }
        .mini-btn.delete:hover { background: #4d2630; }

        .edit-box { display: flex; flex-direction: column; gap: 6px; background-color: #1d1d26; padding: 8px; border-radius: 10px; border: 1px solid #00d4ff; }
        .edit-textarea { width: 100%; min-height: 56px; resize: vertical; padding: 8px; border-radius: 8px; border: 1px solid #3a3a48; background-color: #14141b; color: #fff; font-size: 0.9rem; outline: none; }
        .edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
        .save-edit-btn { background-color: #00d4ff; color: #121212; border: none; padding: 5px 12px; border-radius: 7px; font-weight: bold; font-size: 0.78rem; cursor: pointer; }
        .cancel-edit-btn { background-color: #343444; color: #ddd; border: none; padding: 5px 10px; border-radius: 7px; font-size: 0.78rem; cursor: pointer; }

        .post-body { font-size: 0.95rem; line-height: 1.45; white-space: pre-wrap; }
      .post-img {
            width: 100%;
            max-height: 540px;
            height: auto;
            object-fit: contain;
            background-color: #16161d;
            border-radius: 10px;
            border: 1px solid #3e3e50;
            cursor: zoom-in;
            display: block;
        }
        .original-text { font-size: 0.78rem; color: #9ce6c2; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.18); font-style: italic; }

        /* Acciones del muro: Responder, Compartir, Me gusta */
        .post-actions { display: flex; justify-content: space-around; border-top: 1px solid #363645; padding-top: 8px; gap: 6px; }
        .action-btn { flex: 1; background: #23232d; color: #cfd0e0; border: 1px solid #343444; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .action-btn:hover { background: #30303e; }
        .action-btn.liked { color: #ff6b84; border-color: #ff6b84; background: rgba(255, 59, 92, 0.12); }

        /* Caja de respuestas */
        .replies-box { display: none; flex-direction: column; gap: 8px; background-color: #20202a; padding: 10px; border-radius: 10px; border: 1px solid #323242; margin-top: 2px; }
        .replies-box.open { display: flex; }
        .reply-item { background-color: #2a2a38; padding: 7px 10px; border-radius: 8px; font-size: 0.84rem; display: flex; flex-direction: column; gap: 3px; }
        .reply-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .reply-meta { font-size: 0.72rem; color: #9fd8ef; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        .reply-form { display: flex; gap: 6px; }
        .reply-input { flex: 1; padding: 6px 10px; border-radius: 8px; border: 1px solid #3a3a48; background-color: #181820; color: #fff; font-size: 0.82rem; outline: none; }
        .reply-send-btn { background-color: #00d4ff; color: #121212; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.78rem; cursor: pointer; }

        /* Vista de Perfil */
        .profile-search-bar { display: flex; gap: 6px; padding: 10px 14px; background-color: #252530; border-bottom: 1px solid #3a3a48; align-items: center; flex-wrap: wrap; }
        .profile-card { background: linear-gradient(145deg, #282836, #21212c); border: 1px solid #3b3b4e; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .profile-top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
        .profile-big-avatar { width: 74px; height: 74px; border-radius: 50%; border: 3px solid #00d4ff; background-color: #323242; display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow: hidden; flex-shrink: 0; }
        .profile-big-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 4px; }
        .profile-handle { font-size: 1.15rem; font-weight: bold; color: #00d4ff; }
        .profile-bio { font-size: 0.88rem; color: #d5d7e6; line-height: 1.4; }
        .profile-stats { display: flex; gap: 14px; font-size: 0.8rem; color: #9ce6c2; margin-top: 2px; }
        .profile-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .bio-edit-row { display: flex; gap: 6px; width: 100%; margin-top: 4px; }
        .bio-input { flex: 1; padding: 7px 10px; border-radius: 8px; border: 1px solid #3a3a48; background-color: #181820; color: #fff; font-size: 0.82rem; outline: none; }
        .section-divider { font-size: 0.84rem; font-weight: bold; color: #a9acc4; padding: 4px 2px; border-bottom: 1px solid #343444; }

        /* Chat en vivo */
        .rooms { display: flex; background-color: #252530; padding: 8px; gap: 8px; overflow-x: auto; align-items: center; }
        .room-btn { background: #323240; color: #ccc; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
        .room-btn.active { background: #00d4ff; color: #121212; font-weight: bold; }

        .dm-bar { display: none; background-color: #22222c; padding: 8px 12px; gap: 8px; align-items: center; border-bottom: 1px solid #3a3a48; flex-wrap: wrap; }
        .dm-bar.active { display: flex; }
        .dm-input { flex: 1; min-width: 140px; }
        .dm-connect-btn { background-color: #00d4ff; color: #121212; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.82rem; cursor: pointer; }
        .dm-status { font-size: 0.78rem; color: #9ce6c2; width: 100%; }
        .dm-shortcuts { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
        .dm-chip { background: #2e2e3d; color: #e2e8f0; border: 1px solid #46465c; padding: 3px 9px; border-radius: 999px; font-size: 0.75rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        .dm-chip.unread { border-color: #ff3b5c; color: #ffb3c1; font-weight: bold; }

        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; }
        .message.received { background-color: #2d2d3a; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.sent { background-color: #005c7a; align-self: flex-end; border-bottom-right-radius: 2px; }
        .meta { font-size: 0.75rem; color: #b5b5c7; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
        .input-area { display: flex; padding: 12px; background-color: #2b2b36; gap: 8px; }
        input.msg-input { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; background-color: #1e1e24; color: white; outline: none; }
        button.send-btn { background-color: #00d4ff; color: #121212; border: none; padding: 0 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        button.send-btn:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1> Eggs</h1>
        <div class="header-controls">
            <div class="profile-box" title="Ver mi perfil o editar mi @usuario">
                <button type="button" class="avatar-btn" id="myAvatarBtn" onclick="openMyProfile()" title="Ir a mi perfil">👤</button>
                <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
                <input type="text" id="userName" class="nick-input" value="Usuario" maxlength="15" title="Tu @usuario" onchange="handleMyNickChange()">
            </div>
            <select id="userLang" onchange="handleLangChange()">
                <option value="es">🇪🇸 Español</option>
                <option value="en">🇺🇸/🇬🇧 English</option>
                <option value="pt">🇧🇷/🇵🇹 Português</option>
                <option value="fr">🇫🇷/🇨🇦 Français</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="ja">🇯🇵 日本語 (Japonés)</option>
                <option value="ko">🇰🇷 한국어 (Coreano)</option>
                <option value="zh-CN">🇨🇳 中文 (Chino)</option>
                <option value="ru">🇷🇺 Русский (Ruso)</option>
                <option value="ar">🇸🇦 العربية (Árabe)</option>
                <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
                <option value="nl">🇳🇱 Nederlands</option>
                <option value="sv">🇸🇪 Svenska</option>
                <option value="pl">🇵🇱 Polski</option>
                <option value="tr">🇹🇷 Türkçe</option>
                <option value="custom">✏️ Otro código...</option>
            </select>
            <input type="text" id="customLangCode" class="custom-lang-input" placeholder="ej. uk, el, th" maxlength="8" title="Código ISO de idioma" onchange="refreshActiveView()">
        </div>
    </div>

    <!-- NOTIFICACIÓN DE MENSAJE PRIVADO CON ACCESO DIRECTO -->
    <div class="toast-banner" id="toastBanner">
        <div class="toast-left">
            <span id="toastAvatar">👤</span>
            <div class="toast-text-wrap">
                <span class="toast-title" id="toastTitle">Nuevo mensaje privado</span>
                <span class="toast-preview" id="toastPreview">...</span>
            </div>
        </div>
        <div class="toast-actions">
            <button type="button" class="toast-open-btn" id="toastOpenBtn">Abrir chat</button>
            <button type="button" class="toast-close-btn" onclick="dismissToast()">✕</button>
        </div>
    </div>

    <div class="main-tabs">
        <button class="tab-btn active" id="tabFeedBtn" onclick="switchMainTab('feed')">📰 Muro</button>
        <button class="tab-btn" id="tabChatBtn" onclick="switchMainTab('chat')">💬 Chat <span class="badge-pill" id="chatUnreadBadge">0</span></button>
        <button class="tab-btn" id="tabProfileBtn" onclick="openMyProfile()">👤 Perfil</button>
    </div>

    <!-- VISTA 1: MURO ESTILO X -->
    <div class="view active" id="feedView">
        <div class="composer">
            <textarea id="postText" placeholder="Escribe en cualquier idioma... se traducirá al idioma que elijas leer." maxlength="500"></textarea>
            <div class="composer-row">
                <label class="file-btn" for="postFileInput">📁 Elegir foto</label>
                <input type="file" id="postFileInput" accept="image/*" style="display:none;" onchange="handleImageFile(event)">
                <input type="url" id="postImgUrl" class="img-url-input" placeholder="O pega enlace de imagen (opcional)">
                <button class="post-btn" id="publishBtn" onclick="publishPost()">Publicar</button>
            </div>
            <div class="preview-strip" id="postPreviewStrip">
                <img id="postPreviewThumb" class="preview-thumb" alt="Vista previa">
                <span id="postPreviewLabel" class="preview-label">Foto lista</span>
                <button type="button" class="clear-img-btn" onclick="clearSelectedImage()">Quitar</button>
            </div>
        </div>
        <div class="feed-box" id="feedBox">
            <div class="post-card">
                <div class="post-body">Cargando publicaciones del muro...</div>
            </div>
        </div>
    </div>

    <!-- VISTA 2: CHAT EN VIVO -->
    <div class="view" id="chatView">
        <div class="rooms">
            <button class="room-btn active" data-room="General" onclick="changeRoom(this, 'General')">🌐 General</button>
            <button class="room-btn" data-room="Fútbol" onclick="changeRoom(this, 'Fútbol')">⚽ Fútbol</button>
            <button class="room-btn" data-room="Música" onclick="changeRoom(this, 'Música')">🎵 Música</button>
            <button class="room-btn" data-room="Viajes" onclick="changeRoom(this, 'Viajes')">✈️ Viajes</button>
            <button class="room-btn" data-room="DM" onclick="openPrivateMode(this)">🔒 Privado 1 a 1 <span class="badge-pill" id="dmUnreadBadge">0</span></button>
        </div>

        <div class="dm-bar" id="dmBar">
            <input type="text" id="targetUserInput" class="dm-input" placeholder="@usuario destino (ej. liam_ca)" maxlength="15" onkeypress="if(event.key==='Enter') connectPrivateChat()">
            <button class="dm-connect-btn" onclick="connectPrivateChat()">Conectar</button>
            <div class="dm-status" id="dmStatus">Escribe el @usuario con quien quieres hablar en privado.</div>
            <div class="dm-shortcuts" id="dmShortcuts"></div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message received">
                <span class="meta">Sistema 🤖</span>
                Conectando a la sala en tiempo real...
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="msgInput" class="msg-input" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <!-- VISTA 3: PERFIL PROPIO Y DE OTROS USUARIOS -->
    <div class="view" id="profileView">
        <div class="profile-search-bar">
            <input type="text" id="profileSearchInput" class="dm-input" placeholder="Buscar @usuario (ej. daniel)" maxlength="15" onkeypress="if(event.key==='Enter') searchUserProfile()">
            <button type="button" class="dm-connect-btn" onclick="searchUserProfile()">Ver perfil</button>
            <button type="button" class="mini-btn" onclick="openMyProfile()">Mi perfil</button>
        </div>
        <div class="feed-box" id="profileContentBox">
            <div class="post-card">
                <div class="post-body">Cargando perfil...</div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, update, remove, onValue, off, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAYx6V1BBsLhXJGOTVBQ4BjN38TqoRaqEA",
        authDomain: "panchat-america.firebaseapp.com",
        databaseURL: "https://panchat-america-default-rtdb.firebaseio.com",
        projectId: "panchat-america"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const feedBox = document.getElementById('feedBox');
    const postText = document.getElementById('postText');
    const postImgUrl = document.getElementById('postImgUrl');
    const publishBtn = document.getElementById('publishBtn');

    const chatBox = document.getElementById('chatBox');
    const msgInput = document.getElementById('msgInput');
    const userLang = document.getElementById('userLang');
    const customLangCode = document.getElementById('customLangCode');
    const userName = document.getElementById('userName');
    const sendBtn = document.getElementById('sendBtn');
    const myAvatarBtn = document.getElementById('myAvatarBtn');

    const toastBanner = document.getElementById('toastBanner');
    const toastAvatar = document.getElementById('toastAvatar');

            const ctx = new AudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(740, ctx.currentTime);
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.19);
        } catch {}
    }

function getHiddenChatsKey() {
    const me = normalizeHandle(getMyHandle() || 'guest');
    return `hiddenPrivateChats_${me}`;

function getHiddenPrivateChats() {
    try {
        return new Set(JSON.parse(localStorage.getItem(getHiddenChatsKey()) || '[]'));
    } catch {
        return new Set();
    }
}

function hidePrivateChatForMe(partnerHandle) {
    const clean = normalizeHandle(partnerHandle);
    if (!clean) return;
    const hidden = getHiddenPrivateChats();
    hidden.add(clean);
    localStorage.setItem(getHiddenChatsKey(), JSON.stringify([...hidden]));

    if (typeof currentPrivateTarget !== 'undefined' && normalizeHandle(currentPrivateTarget) === clean) {
        currentPrivateTarget = '';
        if (typeof messagesDiv !== 'undefined' && messagesDiv) messagesDiv.innerHTML = '';
    }
    if (typeof renderDmShortcuts === 'function') renderDmShortcuts();
}

function unhidePrivateChatForMe(partnerHandle) {
    const clean = normalizeHandle(partnerHandle);
    if (!clean) return;
    const hidden = getHiddenPrivateChats();
    if (hidden.delete(clean)) {
        localStorage.setItem(getHiddenChatsKey(), JSON.stringify([...hidden]));
    }
}

function processPrivateChatsNotifications(chatsData) {
    allPrivateChatsData = chatsData && typeof chatsData === 'object' ? chatsData : {};
    const myHandle = normalizeHandle(getMyHandle());
    if (!myHandle) return;

    let changed = false;
    for (const [pairId, pairObj] of Object.entries(allPrivateChatsData)) {
        const parts = pairId.split('__');
        if (parts.length !== 2) continue;
        const [u1, u2] = parts.map(h => normalizeHandle(h));
        if (u1 !== myHandle && u2 !== myHandle) continue;

        const peerHandle = u1 === myHandle ? u2 : u1;
        recentPeers.add(peerHandle);

        const msgsObj = pairObj && pairObj.messages && typeof pairObj.messages === 'object' ? pairObj.messages : {};
        for (const [msgId, msg] of Object.entries(msgsObj)) {
            if (!msg) continue;
            const senderHandle = normalizeHandle(msg.sender);
            if (!senderHandle || senderHandle === myHandle) continue;

            const uniqueKey = `${pairId}/${msgId}`;
            const isViewingThisDmNow =
                activeTab === 'chat' &&
                chatMode === 'dm' &&
                normalizeHandle(currentPrivateTarget) === peerHandle;
            const msgTime = Number(msg.timestamp || 0);

            if (msgTime >= sessionStartTime - 1500 && !notifiedMessageKeys.has(uniqueKey)) {
                notifiedMessageKeys.add(uniqueKey);
                if (!isViewingThisDmNow) {
                    unreadByPeer.set(peerHandle, (unreadByPeer.get(peerHandle) || 0) + 1);
                    changed = true;
                    showPrivateNotification(senderHandle, msg.text, msg.lang);
                }
            }
        }
    }

    if (changed) {
        refreshUnreadBadges();
    } else {
        renderDmShortcuts();
    }
}

    function compressImageFile(file, maxWidth = 700, quality = 0.72) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const scale = img.width > maxWidth ? maxWidth / img.width : 1;
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => reject(new Error("No se pudo leer la imagen."));
            img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error("No se pudo abrir el archivo."));
        reader.readAsDataURL(file);
    });
}

        if (!text || sourceLang === targetLang) return text;
        const cacheKey = `${sourceLang}|${targetLang}|${text}`;
        if (translationCache.has(cacheKey)) {
            return translationCache.get(cacheKey);
        }
        try {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`;
            const response = await fetch(url);
            const data = await response.json();
            const translated = data?.responseData?.translatedText || text;
            translationCache.set(cacheKey, translated);
            return translated;
        } catch {
            return text;
        }
    }

            await remove(targetRef);
        } else {
            await set(targetRef, true);
        }
    };

    function renderFollowButtonHtml(targetHandle) {
        const myHandle = getMyHandle();
        const cleanTarget = normalizeHandle(targetHandle);
        if (!cleanTarget || cleanTarget === myHandle) return '';
        const isFollowing = followingSet.has(cleanTarget);
        const label = isFollowing ? '✓ Siguiendo' : '+ Seguir';
        return `<button type="button" class="mini-btn" onclick="toggleFollowUser('${escapeHtml(cleanTarget)}')">${label}</button>`;
    }

    window.refreshActiveView = async function() {
        if (activeTab === 'feed') {
            const myHandle = getMyHandle();
            const followedPosts = latestPosts.filter((post) => {
                const authorHandle = normalizeHandle(post.author || post.handle || post.user || '');
                if (!authorHandle) return false;
                return authorHandle === myHandle || followingSet.has(authorHandle);
            });
            await renderPosts(
                followedPosts,
                feedBox,
                "Aún no hay publicaciones de personas que sigues. Busca un @usuario en Perfil para seguirlo."
            );
        } else if (activeTab === 'chat') {
            await renderMessages(latestMessages);
        } else if (activeTab === 'profile') {
            await renderProfileView();
        }
    };

    function canManageItem(item) {
        const myHandle = getMyHandle();
        const ownerHandle = item.repostedBy
            ? normalizeHandle(item.repostedBy)
            : normalizeHandle(item.author || 'usuario');
        return ownerHandle === myHandle || item.clientId === window.panClientId;
    }

    async function createPostCardElement(post) {
        const myLang = getSelectedLang();
        const myHandle = getMyHandle();

        const translated = await translateText(post.text, post.lang, myLang);
        const showOriginal = post.lang && post.lang !== myLang;
        const dateStr = post.timestamp ? new Date(post.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        const safeImg = post.imageUrl && isSafeImageSource(post.imageUrl) ? escapeHtml(post.imageUrl) : '';

        const likesMap = post.likes && typeof post.likes === 'object' ? post.likes : {};
        const likeCount = Object.keys(likesMap).length;
        const iLiked = Boolean(likesMap[myHandle]);

        const repostCount = Number(post.reposts || 0);
        const repliesObj = post.replies && typeof post.replies === 'object' ? post.replies : {};
        const repliesEntries = Object.entries(repliesObj).sort((a, b) => (a[1].timestamp || 0) - (b[1].timestamp || 0));
        const isReplyOpen = openReplyPostIds.has(post.id);
        const isOwner = canManageItem(post);
        const isEditing = editingPostId === post.id;

        let repliesHtml = '';
        for (const [replyId, rep] of repliesEntries) {
            const repTranslated = await translateText(rep.text, rep.lang, myLang);
            const canDeleteReply = canManageItem(rep);
            const repAuthor = normalizeHandle(rep.author) || 'usuario';
            repliesHtml += `
                <div class="reply-item">
                    <div class="reply-top">
                        <span class="reply-meta">
                            <span class="user-link" onclick="openUserProfile('${escapeHtml(repAuthor)}')" title="Ver perfil de @${escapeHtml(repAuthor)}">
                                ${renderAvatarTag(repAuthor, 'chat-avatar', rep.avatar)} @${escapeHtml(repAuthor)}
                            </span>
                            · ${escapeHtml((rep.lang || 'es').toUpperCase())}
                        </span>
                        ${canDeleteReply ? `<button type="button" class="mini-btn delete" onclick="deleteReply('${escapeHtml(post.id)}', '${escapeHtml(replyId)}')">✕</button>` : ''}
                    </div>
                    <div>${escapeHtml(repTranslated)}</div>
                </div>
            `;
        }

        const editSectionHtml = isEditing ? `
            <div class="edit-box">
                <textarea id="editTextarea-${escapeHtml(post.id)}" class="edit-textarea" maxlength="500">${escapeHtml(post.text || '')}</textarea>
                <div class="edit-actions">
                    <button type="button" class="cancel-edit-btn" onclick="cancelEditPost()">Cancelar</button>
                    <button type="button" class="save-edit-btn" onclick="saveEditedPost('${escapeHtml(post.id)}')">Guardar cambios</button>
                </div>
            </div>
        ` : (translated ? `<div class="post-body">${escapeHtml(translated)}</div>` : '');

        const postAuthor = normalizeHandle(post.author) || 'usuario';
        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
            ${post.repostedBy ? `<div class="repost-tag">🔁 Compartido por <span class="user-link" onclick="openUserProfile('${escapeHtml(normalizeHandle(post.repostedBy))}')">@${escapeHtml(normalizeHandle(post.repostedBy))}</span></div>` : ''}
            <div class="post-header">
                <div class="author-row">
                    <span class="user-link" onclick="openUserProfile('${escapeHtml(postAuthor)}')" title="Ver perfil de @${escapeHtml(postAuthor)}">
                        ${renderAvatarTag(postAuthor, 'mini-avatar', post.avatar)}
                        <span class="post-author">@${escapeHtml(postAuthor)}</span>
                    </span>
                    <span>· ${escapeHtml((post.lang || 'es').toUpperCase())}</span>
                    ${post.editedAt ? `<span class="edited-tag">(editado)</span>` : ''}
                </div>
                <div class="owner-tools">
                    <span>${dateStr}</span>
                    ${isOwner ? `<button type="button" class="mini-btn" onclick="startEditPost('${escapeHtml(post.id)}')">✏️ Editar</button>` : ''}
                    ${isOwner ? `<button type="button" class="mini-btn delete" onclick="deletePost('${escapeHtml(post.id)}')">🗑️ Borrar</button>` : ''}
                </div>
            </div>
            ${editSectionHtml}
            ${safeImg ? `<img src="${safeImg}" alt="Imagen publicada" class="post-img" loading="lazy" onerror="this.style.display='none'">` : ''}
            ${!isEditing && showOriginal && post.text ? `<div class="original-text">Original (${escapeHtml(post.lang.toUpperCase())}): ${escapeHtml(post.text)}</div>` : ''}
            <div class="post-actions">
                <button type="button" class="action-btn" onclick="toggleRepliesBox('${escapeHtml(post.id)}')">💬 Responder (${repliesEntries.length})</button>
                <button type="button" class="action-btn" onclick="sharePost('${escapeHtml(post.id)}')">🔁 Compartir (${repostCount})</button>
                <button type="button" class="action-btn ${iLiked ? 'liked' : ''}" onclick="toggleLikePost('${escapeHtml(post.id)}')">${iLiked ? '❤️' : '🤍'} Me gusta (${likeCount})</button>
            </div>
            <div class="replies-box ${isReplyOpen ? 'open' : ''}" id="replies-${escapeHtml(post.id)}">
                ${repliesHtml}
                <div class="reply-form">
                    <input type="text" id="replyInput-${escapeHtml(post.id)}" class="reply-input" placeholder="Escribe una respuesta..." maxlength="280" onkeypress="if(event.key==='Enter') sendReply('${escapeHtml(post.id)}')">
                    <button type="button" class="reply-send-btn" onclick="sendReply('${escapeHtml(post.id)}')">Responder</button>
                </div>
            </div>
        `;
        return card;
    }

    async function renderPosts(postsArray, containerEl, emptyMessage) {
        if (!postsArray.length) {
            containerEl.innerHTML = `<div class="post-card"><div class="post-body">${escapeHtml(emptyMessage)}</div></div>`;
            return;
        }

        const ordered = [...postsArray].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        containerEl.innerHTML = '';

        for (const post of ordered) {
            const card = await createPostCardElement(post);
            containerEl.appendChild(card);
        }
    }

    window.startEditPost = function(postId) {
        editingPostId = postId;
        refreshActiveView();
        setTimeout(() => {
            const ta = document.getElementById(`editTextarea-${postId}`);
            if (ta) ta.focus();
        }, 30);
    };

    window.cancelEditPost = function() {
        editingPostId = null;
        refreshActiveView();
    };

    window.saveEditedPost = async function(postId) {
        const ta = document.getElementById(`editTextarea-${postId}`);
        const targetPost = latestPosts.find(p => p.id === postId);
        if (!ta || !targetPost) return;

        const updatedText = ta.value.trim();
        if (!updatedText && !targetPost.imageUrl) {
            alert("La publicación no puede quedar vacía si no tiene imagen.");
            return;
        }

        try {
            await update(ref(db, `feed/posts/${postId}`), {
                text: updatedText,
                lang: getSelectedLang(),
                editedAt: Date.now()
            });
            editingPostId = null;
        } catch (error) {
            alert("No se pudo guardar la edición: " + error.message);
        }
    };

    window.deletePost = async function(postId) {
        const confirmDelete = confirm("¿Seguro que quieres eliminar esta publicación?");
        if (!confirmDelete) return;

        try {
            if (editingPostId === postId) editingPostId = null;
            openReplyPostIds.delete(postId);
            await remove(ref(db, `feed/posts/${postId}`));
        } catch (error) {
            alert("No se pudo eliminar la publicación: " + error.message);
        }
    };

    window.deleteReply = async function(postId, replyId) {
        try {
            await remove(ref(db, `feed/posts/${postId}/replies/${replyId}`));
        } catch (error) {
            alert("No se pudo eliminar la respuesta: " + error.message);
        }
    };

    window.toggleRepliesBox = function(postId) {
        if (openReplyPostIds.has(postId)) {
            openReplyPostIds.delete(postId);
        } else {
            openReplyPostIds.add(postId);
        }
        refreshActiveView();
        setTimeout(() => {
            const input = document.getElementById(`replyInput-${postId}`);
            if (input && openReplyPostIds.has(postId)) input.focus();
        }, 30);
    };

    window.toggleLikePost = async function(postId) {
        const myHandle = getMyHandle();
        const targetPost = latestPosts.find(p => p.id === postId);
        if (!targetPost) return;

        const likesMap = targetPost.likes && typeof targetPost.likes === 'object' ? { ...targetPost.likes } : {};
        if (likesMap[myHandle]) {
            delete likesMap[myHandle];
        } else {
            likesMap[myHandle] = true;
        }

        try {
            await update(ref(db, `feed/posts/${postId}`), { likes: likesMap });
        } catch (error) {
            alert("No se pudo actualizar el me gusta: " + error.message);
        }
    };

    window.sharePost = async function(postId) {
        const myHandle = getMyHandle();
        const targetPost = latestPosts.find(p => p.id === postId);
        if (!targetPost) return;

        const currentReposts = Number(targetPost.reposts || 0);

        try {
            await update(ref(db, `feed/posts/${postId}`), { reposts: currentReposts + 1 });
            await push(ref(db, 'feed/posts'), {
                author: targetPost.author || 'usuario',
                repostedBy: myHandle,
                clientId: window.panClientId,
                text: targetPost.text || '',
                imageUrl: targetPost.imageUrl || '',
                lang: targetPost.lang || 'es',
                likes: {},
                reposts: 0,
                replies: {},
                timestamp: Date.now()
            });
        } catch (error) {
            alert("No se pudo compartir: " + error.message);
        }
    };

    window.sendReply = async function(postId) {
        const input = document.getElementById(`replyInput-${postId}`);
        if (!input) return;
        const text = input.value.trim();
        if (!text) return;

        openReplyPostIds.add(postId);
        try {
            await push(ref(db, `feed/posts/${postId}/replies`), {
                author: getMyHandle(),
                clientId: window.panClientId,
                text: text,
                lang: getSelectedLang(),
                timestamp: Date.now()
            });
            input.value = '';
        } catch (error) {
            alert("No se pudo enviar la respuesta: " + error.message);
        }
    };

    window.publishPost = async function() {
        const text = postText.value.trim();
        const typedUrl = postImgUrl.value.trim();
        const finalImg = selectedPostImage || typedUrl;

        if (!text && !finalImg) {
            alert("Escribe un pensamiento, elige una foto o pega un enlace para publicar.");
            return;
        }
        if (finalImg && !isSafeImageSource(finalImg)) {
            alert("El enlace de imagen no es válido.");
            return;
        }

        publishBtn.disabled = true;
        postText.disabled = true;

        try {
            const postsRef = ref(db, 'feed/posts');
            await push(postsRef, {
                author: getMyHandle(),
                clientId: window.panClientId,
                text: text,
                imageUrl: finalImg || '',
                lang: getSelectedLang(),
                likes: {},
                reposts: 0,
                replies: {},
                timestamp: Date.now()
            });
            postText.value = '';
            postImgUrl.value = '';
            clearSelectedImage();
        } catch (error) {
            alert("No se pudo publicar: " + error.message);
        } finally {
            publishBtn.disabled = false;
            postText.disabled = false;
            postText.focus();
        }
    };

    async function renderMessages(messagesArray) {

                    </span>

    function subscribeToFollowing() {
        const myHandle = getMyHandle();
        if (followingRefCurrent) {
            off(followingRefCurrent);
            followingRefCurrent = null;

        if (!myHandle || myHandle === 'usuario') {
            followingSet = new Set();

            msgInput.value = '';
        } catch (error) {
            alert("No se pudo enviar el mensaje: " + error.message);
        } finally {
            sendBtn.disabled = false;
            msgInput.disabled = false;
            msgInput.focus();
        }
    };

    updateMyHeaderAvatar();
    subscribeToProfiles();
    subscribeToFeed();
    subscribeToAllPrivateChats();
    subscribeToPath(currentDbPath);

    // Visor a pantalla completa para ver fotos del muro al detalle
    const imgZoomOverlay = document.createElement('div');
    imgZoomOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:100000;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;';
    imgZoomOverlay.innerHTML = '<img id="zoomedImgTarget" style="max-width:96vw;max-height:94vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.8);">';
    imgZoomOverlay.onclick = () => { imgZoomOverlay.style.display = 'none'; };
    document.body.appendChild(imgZoomOverlay);

    if (feedBox) {
        feedBox.addEventListener('click', (e) => {
            const img = e.target.closest('img.post-img');
            if (!img) return;
            document.getElementById('zoomedImgTarget').src = img.src;
            imgZoomOverlay.style.display = 'flex';
        });
    }
</script>
    
</body>
</html>
